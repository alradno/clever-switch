name: Motion transport lab

on:
  push:
    branches: [feature/lan-input]
    paths:
      - 'experiments/**'
      - 'src/cleverswitch/flow/input_motion*.py'
      - '.github/workflows/motion-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixed lab dependencies
        run: python -m pip install cryptography==50.0.2 pytest==9.1.1 pytest-cov==7.1.0 coverage==7.16.2 ruff==0.15.6
      - name: Check experiment source
        run: python -m ruff check experiments
      - name: Test pinned TLS bootstrap, shared UDP, ordering and bounded recovery
        run: python -m pytest experiments -o addopts='' --cov=cleverswitch.flow.input_motion --cov=cleverswitch.flow.input_motion_link --cov-report=term-missing --cov-report=json:motion-lab-coverage.json --cov-fail-under=95 --junitxml=motion-lab-tests.xml
      - name: Compare both transports under identical modeled failures
        run: python experiments/benchmark_motion.py > motion-lab-model.json
      - name: Upload lab evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ runner.os }}-motion-lab-${{ github.sha }}
          path: |
            motion-lab-tests.xml
            motion-lab-coverage.json
            motion-lab-model.json
          if-no-files-found: error
          retention-days: 14
