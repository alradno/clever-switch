name: Windows candidate

on:
  push:
    branches: [feature/lan-input]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.py'
      - '*.ps1'
      - 'pyproject.toml'
      - 'requirements-windows-lock.txt'
      - '.github/workflows/windows-candidate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixed dependencies
        run: python -m pip install -r requirements-windows-lock.txt
      - name: Make reviewed HID library available
        shell: pwsh
        run: Copy-Item hidapi.dll (Split-Path (Get-Command python).Source)
      - name: Check source
        run: python -m ruff check src tests benchmarks build_tray.py tray_main.py
      - name: Run Windows tests
        run: python -m pytest --junitxml=windows-tests.xml
      - name: Build Windows candidate
        run: python build_tray.py
      - name: Check packaged executable without capturing input
        shell: pwsh
        run: |
          $reportPath = Join-Path $PWD 'windows-input-check.json'
          $process = Start-Process .\dist\CleverSwitchTray.exe -ArgumentList @('--input-check', ('"' + $reportPath + '"')) -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'The packaged check did not finish within 30 seconds'
          }
          if ($process.ExitCode -ne 0) { throw 'The packaged check failed' }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if ($report.platform -ne 'win32' -or -not $report.edition) {
            throw 'The packaged executable did not produce its Windows report'
          }
          "Commit: $env:GITHUB_SHA. Native build and read-only packaged check; physical input acceptance remains separate." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload candidate with matching installer and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CleverSwitch-Windows-${{ github.sha }}
          path: |
            dist/CleverSwitchTray.exe
            dist/Install-CleverSwitch.ps1
            dist/Configure-CleverSwitchFirewall.ps1
            dist/cleverswitch-package.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-validation-${{ github.sha }}
          path: |
            windows-tests.xml
            windows-input-check.json
          retention-days: 14
